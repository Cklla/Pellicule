# =============================================================================
# CI Pellicule — les jobs proviennent du socle partage Cklla/ci-templates.
#
# Ce fichier ne contient QUE ce qui est propre a Pellicule : le stage, la
# reference au socle, et la preparation Firebase. Toute correction apportee
# aux jobs eux-memes se fait dans ci-templates puis se recupere ici en
# changeant `ref`.
#
# Prerequis cote GitLab (Settings > CI/CD > Variables) :
#   GOOGLE_SERVICES_JSON  fichier, le google-services.json du projet Firebase
# La variable NVD_API_KEY n'est plus utilisee : le scan de vulnerabilites ne
# s'appuie plus sur la base NVD.
# =============================================================================

include:
  - project: 'Cklla/ci-templates'
    ref: 'v1.2.1'
    file:
      # unit_tests
      - '/templates/gradle-tests.gitlab-ci.yml'
      # secret_scan
      - '/templates/secret-scan.gitlab-ci.yml'
      # dependency_inventory + dependency_scan
      - '/templates/gradle-security.gitlab-ci.yml'

stages:
  - test

# -----------------------------------------------------------------------------
# Surcharges propres au projet.
#
# Les plugins Firebase (google-services) lisent google-services.json des la
# phase de CONFIGURATION Gradle : sans ce fichier, meme une simple resolution
# de dependances echoue. Les deux jobs qui invoquent Gradle en ont donc besoin.
#
# Attention : en GitLab CI une surcharge REMPLACE la cle, elle ne s'y ajoute
# pas. Les templates laissent `before_script` vide a dessein pour que ces
# blocs ne fassent rien perdre.
#
# La cle TMDB n'est PAS necessaire ici : app/build.gradle.kts la lit dans
# local.properties avec une valeur par defaut vide, la compilation et les
# tests unitaires n'en dependent pas.
# -----------------------------------------------------------------------------
unit_tests:
  before_script:
    - cp "$GOOGLE_SERVICES_JSON" app/google-services.json

dependency_inventory:
  before_script:
    - cp "$GOOGLE_SERVICES_JSON" app/google-services.json
